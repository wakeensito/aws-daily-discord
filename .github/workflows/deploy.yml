# Deploy — OIDC-ready stub. Silent no-op on merges until wired, so an
# unwired repo never shows red X's on main.
#
# To wire it up (full steps live in the seeded issue "Wire up deploy pipeline"):
#   1. cd infra/iam && terraform init && terraform apply   # creates the CD role
#   2. gh variable set AWS_DEPLOY_ROLE_ARN --body "<cd_role_arn output>"
#   3. Replace the TODO step below with real build+deploy commands
#   4. gh variable set DEPLOY_ENABLED --body true
#   5. gh workflow run deploy.yml    # dispatch once to verify
#
# Role ARN and targets are repo *variables* (vars.*), not secrets — they are
# not sensitive, and vars are visible/diffable in the UI. Never static AWS
# keys; OIDC role assumption only.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC token exchange
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false # never kill a deploy mid-flight

jobs:
  deploy:
    # Merges no-op until DEPLOY_ENABLED=true; manual dispatch always runs
    # (and fails loudly at the TODO) so wiring can be tested on purpose.
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC — never static keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # sam build validates a matching python binary is present — pin the
      # same version as the Lambda runtime so laptop and CI agree.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Deploy (SAM)
        # The DiscordWebhookUrl / StudentBuilderRoleId parameters were
        # supplied at the first laptop deploy; CloudFormation keeps the
        # previous values, so CI never sees or needs them. samconfig.toml
        # carries the rest; an unchanged stack is a green no-op.
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
