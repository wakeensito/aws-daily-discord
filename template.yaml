AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Daily Cloud Fun Fact bot — EventBridge Scheduler -> Lambda -> Bedrock (Nova
  Micro) -> Discord webhook, with a DynamoDB topic-rotation table. One stack
  owns everything; no account-bearing value is ever committed (pseudo-params
  build every ARN, the webhook URL is a NoEcho parameter).

Parameters:
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
    Description: >-
      Discord webhook URL for the #daily-cloud channel. Supplied at the first
      deploy; CloudFormation keeps the previous value on later deploys, so CI
      never needs to know it. Never written to any tracked file.
  StudentBuilderRoleId:
    Type: String
    Default: ''
    Description: >-
      Discord role ID for the @Student Builder ping (right-click the role ->
      Copy ID). Empty = post without the ping line.
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
    Description: >-
      Bedrock inference profile for post generation. Nova Micro is the
      cheapest text model — this is a light, once-a-day load.
  ScheduleExpression:
    Type: String
    Default: cron(0 12 * * ? *)
    Description: Daily post time, evaluated in ScheduleTimezone.
  ScheduleTimezone:
    Type: String
    Default: America/New_York
    Description: >-
      Noon Miami year-round — the scheduler handles DST, so the post hour
      never drifts.
  CareerWebhookUrl:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Discord webhook URL for the #career channel. Default empty so the
      stack (and CI deploys) work before the webhook exists — the career
      Lambda logs-and-skips until it's supplied via one
      --parameter-overrides deploy. Never written to any tracked file.
  CareerRoleId:
    Type: String
    Default: ''
    Description: >-
      Optional Discord role ID to ping on career digests. Empty = no ping
      (default — the digest is recurring content, not an announcement).
  CareerScheduleExpression:
    Type: String
    Default: cron(0 9 * * ? *)
    Description: >-
      Morning career digest (9 AM in ScheduleTimezone — apply-early
      advantage; the fun fact owns noon).
  CareerAfternoonScheduleExpression:
    Type: String
    Default: cron(0 15 * * ? *)
    Description: >-
      Afternoon career digest (3 PM) — run-based dedup makes it
      incremental: it posts only listings that dropped since 9 AM.

Resources:
  TopicsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-topics'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: topic
          AttributeType: S
      KeySchema:
        - AttributeName: topic
          KeyType: HASH
      # No TTL on purpose: full-cycle rotation needs every used-topic row to
      # persist for the whole ~97-day cycle; the Lambda clears the table
      # itself when the cycle completes.

  DailyPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-post'
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TOPICS_TABLE_NAME: !Ref TopicsTable
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          STUDENT_BUILDER_ROLE_ID: !Ref StudentBuilderRoleId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TopicsTable
        - Statement:
            - Sid: BedrockInvokeNovaMicro
              Effect: Allow
              Action: bedrock:InvokeModel
              # The us.* inference profile routes to the foundation model in
              # any US region, so both ARN shapes must be allowed. Pseudo-
              # params keep the account ID out of the repo.
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-micro-v1:0'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-micro-v1:0'
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub '${AWS::StackName}-schedule'
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone

  # ── Career digest (second bot, same stack) ────────────────────────────
  SeenListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-seen-listings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # TTL on purpose here (unlike the topics table): a listing seen 180
      # days ago belongs to a dead season; expiring rows keeps the table
      # small and the daily batch-get cheap.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  CareerDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-career'
      CodeUri: src/
      Handler: career_digest.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      # Fetches ~10MB of listings JSON from raw.githubusercontent.com.
      Timeout: 90
      MemorySize: 256
      Environment:
        Variables:
          SEEN_TABLE_NAME: !Ref SeenListingsTable
          CAREER_WEBHOOK_URL: !Ref CareerWebhookUrl
          CAREER_ROLE_ID: !Ref CareerRoleId
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SeenListingsTable
        - Statement:
            - Sid: BedrockInvokeNovaMicro
              Effect: Allow
              Action: bedrock:InvokeModel
              # Same two ARN shapes as the fun-fact function: the us.* profile
              # routes to the foundation model in any US region. Pseudo-params
              # keep the account ID out of the repo.
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-micro-v1:0'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-micro-v1:0'
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub '${AWS::StackName}-career-schedule'
            ScheduleExpression: !Ref CareerScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            Input: '{"scope": "usa"}'
        # Second daily digest (~50-90 eligible listings/day is plenty for
        # two): the seen-table dedup is run-based, so this posts only what
        # appeared since the morning run. Day rhythm: 9 AM careers, noon
        # fun fact ("learn something on lunch"), 3 PM careers.
        AfternoonSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub '${AWS::StackName}-career-schedule-pm'
            # Afternoon run is Florida-only: we are a Miami school and local
            # roles need no relocation. Florida is ~200 active listings, so
            # this digest is often short by design.
            ScheduleExpression: !Ref CareerAfternoonScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            Input: '{"scope": "florida"}'

Outputs:
  FunctionName:
    Description: Invoke this to post on demand (or use DRY_RUN=1 locally)
    Value: !Ref DailyPostFunction
  CareerFunctionName:
    Description: The career digest Lambda
    Value: !Ref CareerDigestFunction
  TopicsTableName:
    Description: Topic-rotation table
    Value: !Ref TopicsTable
